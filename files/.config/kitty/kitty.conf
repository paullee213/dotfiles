font_size 12.0

background_opacity 0.70
background_blur 10

window_padding_width 16

scrollback_lines 10000
scrollback_pager_history_size 100

# ==========================================
# 1. WINDOW MANAGEMENT (Splits & Navigation)
# ==========================================
# Neovim equivalents: :vsplit and :split
# # Enable the splits layout (along with any other layouts you want)
enabled_layouts splits,stack,tall,grid

map ctrl+alt+u scroll_page_up
map ctrl+alt+d scroll_page_down
map ctrl+alt+\ launch --location=vsplit --cwd=current
map ctrl+alt+-  launch --location=hsplit --cwd=current

# Close current split (like Neovim :close)
map ctrl+alt+w     close_window

# Vim-style pane navigation (h, j, k, l)
map ctrl+alt+h     neighboring_window left
map ctrl+alt+j     neighboring_window down
map ctrl+alt+k     neighboring_window up
map ctrl+alt+l     neighboring_window right
map ctrl+alt+shift+h  move_window left
map ctrl+alt+shift+j  move_window bottom
map ctrl+alt+shift+k  move_window top
map ctrl+alt+shift+l  move_window right


# ==========================================
# 2. TAB MANAGEMENT
# ==========================================
# Open new tab (retaining current directory)
map ctrl+alt+z scroll_to_prompt -1
map ctrl+alt+x scroll_to_prompt 1
map ctrl+alt+t     new_tab_with_cwd

# Navigate tabs (like Neovim buffer/tab lines)
map ctrl+alt+n     next_tab
map ctrl+alt+p     previous_tab

# Close current tab
map ctrl+alt+q     close_tab


# ==========================================
# 4. LAYOUT SWITCHING
# ==========================================
# Cycle through layouts (Tall, Fat, Grid, etc.)
map ctrl+alt+space next_layout

# Resize
map ctrl+alt+left   resize_window narrower 10
map ctrl+alt+right  resize_window wider 10
map ctrl+alt+up     resize_window taller 10
map ctrl+alt+down   resize_window shorter 10

# Reset split sizes back to equal proportions
map ctrl+alt+equal  resize_window reset
